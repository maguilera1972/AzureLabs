server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/lab-console;
    index index.html;

    server_name azurelabs.aguilera.ch;

    # Derrière Cloudflare Tunnel : le TLS est terminé par Cloudflare
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* ^/docs/Mode-emploi-Lab-Console\.pdf$ {
        add_header Content-Disposition 'inline; filename="Mode-emploi-Lab-Console.pdf"';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /docs/Mode-emploi-Lab-Console.docx {
        return 404;
    }
}
