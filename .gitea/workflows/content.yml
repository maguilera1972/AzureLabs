name: Contenu — mode d'emploi

on:
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: "Recapturer les écrans (Playwright + API locale)"
        type: boolean
        default: false
      commit_changes:
        description: "Commit et push des PDF/captures générés"
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths:
      - "scripts/manual_shared.py"
      - "scripts/manual_pdf.py"
      - "scripts/generate_manual.py"
      - "index.html"
      - "js/**"
      - "css/**"

jobs:
  regenerate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Régénérer le mode d'emploi
        env:
          CAPTURE_SCREENSHOTS: ${{ gitea.event.inputs.capture_screenshots || 'false' }}
          LAB_CONSOLE_HOME: ${{ gitea.workspace }}
        run: |
          chmod +x deploy/regenerate-content.sh
          python3 -m venv venv
          venv/bin/pip install -q -r backend/requirements.txt
          if [[ "$CAPTURE_SCREENSHOTS" == "true" ]]; then
            venv/bin/pip install -q playwright
            venv/bin/playwright install chromium
            systemctl restart lab-console-api || true
            sleep 3
          fi
          CAPTURE_SCREENSHOTS="$CAPTURE_SCREENSHOTS" ./deploy/regenerate-content.sh

      - name: Commit des documents générés
        if: ${{ gitea.event_name == 'push' || (gitea.event_name == 'workflow_dispatch' && gitea.event.inputs.commit_changes == 'true') }}
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@lab-console.local"
          git add docs/Mode-emploi-Lab-Console.pdf docs/Mode-emploi-Lab-Console.docx docs/screenshots/ index.html || true
          if git diff --staged --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git commit -m "docs: régénération du mode d'emploi [skip ci]"
          git push origin HEAD:${{ gitea.ref_name }}
